name: Deploy EKWL MySQL Live

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-ekwl-live
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          find api backend -name '*.php' ! -name '*.local.php' -print0 | xargs -0 -n1 php -l
          for file in *.js; do node --check "$file"; done
      - name: Verify deployment isolation
        run: python3 tests/mysql/deploy-package.py
      - name: Verify report JSON EWO filters
        run: php tests/mysql/json-ewo-filter.php
      - name: Verify Size Set performance in Chrome
        run: |
          python3 -m pip install playwright==1.58.0
          python3 tests/size-set-performance.py
      - name: Run calculation, cache and API adapter regressions
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.cjs tests/mysql/api-client.cjs; do node "$file"; done
      - name: Build code-only release
        run: python3 tools/mysql/build_deploy.py --out /tmp/ekwl-live-deploy --version "${{ github.sha }}"

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.INFINITYFREE_FTP_HOST }}
      FTP_USER: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
      FTP_PASS: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Require hosting credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FTP_HOST" || -z "$FTP_USER" || -z "$FTP_PASS" ]]; then
            echo "::error::Set INFINITYFREE_FTP_HOST, INFINITYFREE_FTP_USERNAME and INFINITYFREE_FTP_PASSWORD in repository Actions secrets. No files were deployed."
            exit 1
          fi
      - name: Build release
        run: python3 tools/mysql/build_deploy.py --out /tmp/ekwl-live-deploy --version "${{ github.sha }}"
      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Update code while preserving server data and config
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASS" "ftp://$FTP_HOST" <<'LFTP'
          set cmd:fail-exit yes
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --verbose --no-perms --parallel=1 --exclude-glob '*.html' --exclude-glob '.htaccess' /tmp/ekwl-live-deploy/site /htdocs
          put /tmp/ekwl-live-deploy/site/backend/.htaccess -o /htdocs/backend/.htaccess
          put /tmp/ekwl-live-deploy/site/.htaccess -o /htdocs/.htaccess
          lcd /tmp/ekwl-live-deploy/site
          cd /htdocs
          mput *.html
          bye
          LFTP
      - name: Install browser verification client
        run: python3 -m pip install playwright==1.58.0
      - name: Verify live release and anonymous API in Chrome
        run: python3 tools/mysql/verify_live.py --version "${{ github.sha }}"
